<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lok Niti — people-powered civic action." />
    <title>Lok Niti.</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <h1 class="visually-hidden" id="hero-title">Lok Niti</h1>
        <a class="hero-brand" href="#top" aria-label="Lok Niti home">
          <svg viewBox="0 0 136.675 86.79" aria-hidden="true">
            <image href="assets/indian-flag.png" x="0" y="2.808" width="83.983" height="83.983" />
            <image href="assets/state-emblem.png" x="4.058" y="4.94" width="83.983" height="55.988" />
            <text class="brand-lok" x="77.562" y="31.5" textLength="58.696" lengthAdjust="spacingAndGlyphs">Lok</text>
            <text class="brand-niti" x="77.562" y="56.2" textLength="59.113" lengthAdjust="spacingAndGlyphs">Niti<tspan fill="#fc5e19">.</tspan></text>
          </svg>
        </a>

        <div class="hero-art" aria-hidden="true">
          <img class="flag-art" src="assets/indian-flag.png" alt="" />
          <img class="emblem-art" src="assets/state-emblem.png" alt="" />
        </div>

        <svg class="hero-type" viewBox="0 0 1920 1080" aria-hidden="true">
          <text class="hero-lok" x="607" y="482" textLength="790" lengthAdjust="spacingAndGlyphs">Lok</text>
          <text class="hero-niti" x="607" y="866" textLength="644" lengthAdjust="spacingAndGlyphs">Niti</text>
          <circle class="hero-dot" cx="1275" cy="848" r="22" />
          <text class="hero-tagline-line" x="604" y="976" textLength="636" lengthAdjust="spacingAndGlyphs">WHAT HAPPENS WHEN THE PEOPLE</text>
          <text class="hero-tagline-line" x="604" y="1028" textLength="636" lengthAdjust="spacingAndGlyphs">AGREE, BUT POLITICS REFUSES TO?</text>
        </svg>

        <a class="donate-button" href="https://Donate.com/donate" target="_blank" rel="noopener noreferrer">Donate</a>
      </section>

      <section class="actions-section" id="actions" aria-label="Get involved">
        <div class="card-grid" id="cardGrid" aria-live="polite"></div>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
